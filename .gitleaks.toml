# ==============================================================================
# gitleaks — إعدادات فحص الأسرار لمشروع ISM POS
# https://github.com/gitleaks/gitleaks
#
# يُشغَّل تلقائياً عبر CI (.github/workflows/ci.yml) على كل push و PR،
# ومحلياً:  gitleaks git . --config .gitleaks.toml
#
# الهدف: منع تكرار كارثة رفع .env (راجع خطة الإصلاح، المرحلة 0)
# ==============================================================================

# توسيع القواعد الافتراضية المدمجة في gitleaks
# (بدون useDefault يُستبدل كامل مجموعة القواعد الافتراضية بهذا الملف!)
[extend]
useDefault = true

# قائمة سماح عامة — إيجابيات كاذبة موثقة فقط
[allowlist]
description = "أمثلة التوثيق: api-docs.php يعرض أمثلة curl مع ترويسة Authorization وتوكنات تجريبية (ism_a1b2c3d4...) وليست أسراراً حقيقية؛ vendor/ تبعيات تطوير لا تُرفع للمستودع أصلاً"
paths = [
    '''api-docs\.php$''',
    '''(^|/)vendor/''',
]

# قاعدة المفاتيح الخاصة (من الافتراضيات) + استثناء موثق واحد:
# includes/push-sender.php يبني ترويسة PEM برمجياً من مفتاح DER محمّل من
# إعدادات النظام — الترويسة ثابتة تُبنى ولا تُخزَّن فيها أي مفاتيح حقيقية.
[[rules]]
id = "private-key"

    [[rules.allowlists]]
    description = "بناء ترويسة PEM برمجياً في push-sender (لا مفاتيح مخزنة)"
    regexTarget = "line"
    regexes = [
        '''\$pem = "-----BEGIN EC PRIVATE KEY-----''',
    ]
