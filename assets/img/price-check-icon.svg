          font-size="120" font-weight="bold" fill="#1a56db">د.م</text>
  </g>
  
  <!-- أيقونة الباركود -->
  <g transform="translate(256, 420)" opacity="0.9">
    <rect x="-60" y="-20" width="8" height="40" rx="2" fill="#fff"/>
    <rect x="-48" y="-20" width="4" height="40" rx="1" fill="#fff"/>
    <rect x="-40" y="-20" width="12" height="40" rx="2" fill="#fff"/>
    <rect x="-24" y="-20" width="4" height="40" rx="1" fill="#fff"/>
    <rect x="-16" y="-20" width="8" height="40" rx="2" fill="#fff"/>
    <rect x="-4" y="-20" width="16" height="40" rx="2" fill="#fff"/>
    <rect x="16" y="-20" width="4" height="40" rx="1" fill="#fff"/>
    <rect x="24" y="-20" width="8" height="40" rx="2" fill="#fff"/>
    <rect x="36" y="-20" width="4" height="40" rx="1" fill="#fff"/>
    <rect x="44" y="-20" width="12" height="40" rx="2" fill="#fff"/>
