<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- خلفية -->
  <rect width="512" height="512" rx="96" fill="#1a56db"/>
  
  <!-- علامة السعر الكبيرة -->
  <g transform="translate(256, 230)">
    <!-- شكل العلامة -->
    <path d="M-110,-100 L110,-100 L160,-50 L160,50 L110,100 L-110,100 L-160,50 L-160,-50 Z" 
          fill="#fff" opacity="0.95"/>
    
    <!-- رمز العملة -->
